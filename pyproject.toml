[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isl-dual"
version = "0.1.0"
description = "Inverse Skill Learning with an inverse-forward dual loop"
requires-python = ">=3.10"
dependencies = []

[project.scripts]
isl-dual = "isl_dual.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
