[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "isl-dual"
version = "0.1.0"
description = "Inverse Skill Learning with an inverse-forward dual loop"
requires-python = ">=3.10"
dependencies = ["PyYAML>=6.0", "tomli>=2.0; python_version < '3.11'"]

[project.scripts]
isl-dual = "isl_dual.cli:main"
isl-dual-family = "isl_dual.experiment:main"
isl-dual-campaign = "isl_dual.campaign:main"
isl-dual-status = "isl_dual.status:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
