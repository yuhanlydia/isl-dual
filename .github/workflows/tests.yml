name: tests

on:
  pull_request:
  push:
    branches:
      - repair-20260903

jobs:
  pytest:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Install
        run: python -m pip install -e . pytest
      - name: Test
        run: python -m pytest -q
